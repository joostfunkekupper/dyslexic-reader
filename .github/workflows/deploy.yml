name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build book list
        run: node scripts/build-manifest.mjs

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css app.js fonts books _site/
          touch _site/.nojekyll

      # Tag asset URLs with the commit so browsers never mix a new page with cached old scripts.
      - name: Add version to asset URLs
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -e "s|href=\"styles.css\"|href=\"styles.css?v=$v\"|" \
                 -e "s|src=\"app.js\"|src=\"app.js?v=$v\"|" _site/index.html
          grep -q "styles.css?v=$v" _site/index.html && grep -q "app.js?v=$v" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
